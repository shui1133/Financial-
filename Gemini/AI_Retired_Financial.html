<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能退休理財規劃師 (AI + RAG)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* 自定義動畫與字體優化 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }

        .animate-spin-slow {
            animation: spin 3s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* 隱藏 range input 的默認樣式 */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
        
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 圖示元件 (替代 lucide-react) ---
        const Icon = ({ children, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const PieChart = ({ className }) => <Icon className={className}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></Icon>;
        const TrendingUp = ({ className }) => <Icon className={className}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></Icon>;
        const Shield = ({ className }) => <Icon className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></Icon>;
        const Zap = ({ className }) => <Icon className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></Icon>;
        const DollarSign = ({ className }) => <Icon className={className}><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></Icon>;
        const RefreshCw = ({ className }) => <Icon className={className}><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></Icon>;
        const BookOpen = ({ className }) => <Icon className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></Icon>;
        const AlertCircle = ({ className }) => <Icon className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></Icon>;
        const ChevronRight = ({ className }) => <Icon className={className}><polyline points="9 18 15 12 9 6"/></Icon>;
        const BarChart3 = ({ className }) => <Icon className={className}><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></Icon>;

        // --- 資料庫 ---
        const ETF_DATABASE = [
            // 市場型 (Market)
            { id: '0050', name: '元大台灣50', type: '市場型', category: 'market', risk: 'high', yield: 3.5, expense: 0.32 },
            { id: '006208', name: '富邦台50', type: '市場型', category: 'market', risk: 'high', yield: 3.6, expense: 0.15 },
            { id: 'VOO', name: 'Vanguard S&P 500', type: '美股市場', category: 'market', risk: 'high', yield: 1.5, expense: 0.03 },
            { id: 'QQQ', name: 'Invesco QQQ', type: '科技成長', category: 'growth', risk: 'very_high', yield: 0.6, expense: 0.20 },
            
            // 高股息 (High Dividend)
            { id: '0056', name: '元大高股息', type: '高股息', category: 'dividend', risk: 'medium', yield: 6.5, expense: 0.35 },
            { id: '00878', name: '國泰永續高股息', type: '高股息', category: 'dividend', risk: 'medium', yield: 6.2, expense: 0.25 },
            { id: '00929', name: '復華台灣科技優息', type: '高股息', category: 'dividend', risk: 'medium', yield: 7.0, expense: 0.33 },
            { id: '00919', name: '群益台灣精選高息', type: '高股息', category: 'dividend', risk: 'medium', yield: 8.0, expense: 0.30 },
            { id: '00713', name: '元大台灣高息低波', type: '高股息', category: 'dividend', risk: 'medium', yield: 5.8, expense: 0.30 },

            // 債券型 (Bond)
            { id: '00679B', name: '元大美債20年', type: '長天期公債', category: 'bond', risk: 'low', yield: 4.2, expense: 0.14 },
            { id: '00687B', name: '國泰20年美債', type: '長天期公債', category: 'bond', risk: 'low', yield: 4.1, expense: 0.14 },
            { id: 'BNDW', name: 'Vanguard全世界債券', type: '全球債券', category: 'bond', risk: 'low', yield: 3.8, expense: 0.06 },
            { id: '00937B', name: '群益ESG投等債20+', type: '投資級債', category: 'bond', risk: 'low', yield: 5.5, expense: 0.20 },

            // 成長/產業型 (Growth)
            { id: '00830', name: '國泰費城半導體', type: '半導體', category: 'growth', risk: 'very_high', yield: 1.2, expense: 0.45 },
            { id: '00881', name: '國泰台灣5G+', type: '科技主題', category: 'growth', risk: 'high', yield: 3.0, expense: 0.40 },
            { id: 'SMH', name: 'VanEck半導體', type: '美股半導體', category: 'growth', risk: 'very_high', yield: 0.8, expense: 0.35 },
        ];

        const RiskProfiles = {
            conservative: {
                label: '保守型',
                desc: '保本為主，抗波動',
                returnRate: 0.045, // 4.5%
                allocation: { market: 10, dividend: 30, growth: 0, bond: 60 },
                icon: <Shield className="w-6 h-6 text-green-400" />
            },
            balanced: {
                label: '穩健型',
                desc: '股債平衡，穩定增長',
                returnRate: 0.065, // 6.5%
                allocation: { market: 30, dividend: 30, growth: 10, bond: 30 },
                icon: <TrendingUp className="w-6 h-6 text-blue-400" />
            },
            aggressive: {
                label: '積極型',
                desc: '追求高報酬，可承受波動',
                returnRate: 0.09, // 9%
                allocation: { market: 40, dividend: 10, growth: 40, bond: 10 },
                icon: <Zap className="w-6 h-6 text-orange-400" />
            }
        };

        const formatCurrency = (val) => {
            return new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', maximumFractionDigits: 0 }).format(val);
        };

        function InvestmentPlanner() {
            // --- 狀態管理 ---
            const [years, setYears] = useState(20);
            const [targetAnnualIncome, setTargetAnnualIncome] = useState(600000); // 目標年收益
            const [riskProfile, setRiskProfile] = useState('balanced');
            const [activeTab, setActiveTab] = useState('plan'); // plan, portfolio, rebalance

            // --- 計算邏輯 (核心演算法) ---
            const calculationResult = useMemo(() => {
                // 1. 根據 4% 法則 (Rule of 25) 計算退休所需本金
                const requiredPrincipal = targetAnnualIncome * 25;

                // 2. 計算所需月投入金額 (年金終值公式反推)
                // FV = PMT * [((1 + r)^n - 1) / r]
                const rate = RiskProfiles[riskProfile].returnRate;
                const monthlyRate = rate / 12;
                const months = years * 12;
                
                let monthlyContribution = 0;
                if (rate > 0) {
                monthlyContribution = (requiredPrincipal * monthlyRate) / (Math.pow(1 + monthlyRate, months) - 1);
                } else {
                monthlyContribution = requiredPrincipal / months;
                }

                // 3. 計算總投入本金與複利效應
                const totalPrincipalInvested = monthlyContribution * months;
                const compoundInterestEarned = requiredPrincipal - totalPrincipalInvested;

                return {
                requiredPrincipal,
                monthlyContribution,
                totalPrincipalInvested,
                compoundInterestEarned,
                annualRatePercent: (rate * 100).toFixed(1)
                };
            }, [years, targetAnnualIncome, riskProfile]);

            // --- 推薦 ETF 篩選 (模擬 AI/RAG 邏輯) ---
            const recommendedETFs = useMemo(() => {
                const allocation = RiskProfiles[riskProfile].allocation;
                const result = [];
                
                // 簡單的加權推薦算法
                Object.keys(allocation).forEach(cat => {
                if (allocation[cat] > 0) {
                    const candidates = ETF_DATABASE.filter(e => e.category === cat);
                    result.push(...candidates.slice(0, cat === 'bond' ? 2 : 3));
                }
                });
                return result;
            }, [riskProfile]);

            return (
                <div className="max-w-7xl mx-auto">
                    {/* Header */}
                    <header className="bg-slate-800 border-b border-slate-700 sticky top-0 z-20">
                        <div className="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2 rounded-lg">
                            <BarChart3 className="w-6 h-6 text-white" />
                            </div>
                            <div>
                            <h1 className="text-xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                                智能退休理財規劃師
                            </h1>
                            <p className="text-xs text-slate-400">AI + RAG 演算法驅動</p>
                            </div>
                        </div>
                        <nav className="flex gap-1 bg-slate-700/50 p-1 rounded-lg overflow-x-auto">
                            {['plan', 'portfolio', 'rebalance'].map(tab => (
                            <button
                                key={tab}
                                onClick={() => setActiveTab(tab)}
                                className={`px-4 py-1.5 rounded-md text-sm font-medium transition-all whitespace-nowrap ${
                                activeTab === tab 
                                    ? 'bg-blue-600 text-white shadow-lg' 
                                    : 'text-slate-400 hover:text-white hover:bg-slate-600'
                                }`}
                            >
                                {tab === 'plan' && '規劃設定'}
                                {tab === 'portfolio' && '投資組合建議'}
                                {tab === 'rebalance' && '再平衡報告'}
                            </button>
                            ))}
                        </nav>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 py-8 pb-20">
                        
                        {/* --- 分頁 1: 規劃設定 (Input & Dashboard) --- */}
                        {activeTab === 'plan' && (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            
                            {/* 左側：輸入控制面板 */}
                            <div className="lg:col-span-1 space-y-6">
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                                <h2 className="text-lg font-semibold mb-6 flex items-center gap-2">
                                <BookOpen className="w-5 h-5 text-blue-400" />
                                投資條件設定
                                </h2>

                                {/* 1. 投資期間 */}
                                <div className="mb-6">
                                <label className="block text-sm text-slate-400 mb-2">投資期間 (年)</label>
                                <div className="flex items-center gap-4 mb-2">
                                    <input 
                                    type="range" min="2" max="40" step="1"
                                    value={years} onChange={(e) => setYears(Number(e.target.value))}
                                    className="w-full h-2 bg-slate-700 rounded-lg cursor-pointer accent-blue-500"
                                    />
                                    <span className="text-xl font-bold text-blue-400 w-12">{years}</span>
                                </div>
                                <div className="flex justify-between text-xs text-slate-500">
                                    <button onClick={() => setYears(5)} className="hover:text-blue-300">5年</button>
                                    <button onClick={() => setYears(10)} className="hover:text-blue-300">10年</button>
                                    <button onClick={() => setYears(20)} className="hover:text-blue-300">20年</button>
                                    <button onClick={() => setYears(30)} className="hover:text-blue-300">30年</button>
                                </div>
                                </div>

                                {/* 2. 目標收益 */}
                                <div className="mb-6">
                                <label className="block text-sm text-slate-400 mb-2">退休後目標年配息 (NT$)</label>
                                <input 
                                    type="number" step="10000"
                                    value={targetAnnualIncome}
                                    onChange={(e) => setTargetAnnualIncome(Number(e.target.value))}
                                    className="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                                />
                                <p className="text-xs text-slate-500 mt-2">相當於每月可領 {formatCurrency(targetAnnualIncome / 12)}</p>
                                </div>

                                {/* 3. 風險屬性 */}
                                <div>
                                <label className="block text-sm text-slate-400 mb-3">風險承受度</label>
                                <div className="space-y-3">
                                    {Object.keys(RiskProfiles).map(key => (
                                    <button
                                        key={key}
                                        onClick={() => setRiskProfile(key)}
                                        className={`w-full flex items-center p-3 rounded-xl border transition-all ${
                                        riskProfile === key 
                                            ? 'bg-blue-600/20 border-blue-500 ring-1 ring-blue-500' 
                                            : 'bg-slate-700/30 border-slate-600 hover:bg-slate-700'
                                        }`}
                                    >
                                        <div className={`p-2 rounded-full mr-3 ${riskProfile === key ? 'bg-blue-500/20' : 'bg-slate-800'}`}>
                                        {RiskProfiles[key].icon}
                                        </div>
                                        <div className="text-left">
                                        <div className={`font-medium ${riskProfile === key ? 'text-blue-400' : 'text-slate-200'}`}>
                                            {RiskProfiles[key].label}
                                        </div>
                                        <div className="text-xs text-slate-500">{RiskProfiles[key].desc}</div>
                                        </div>
                                    </button>
                                    ))}
                                </div>
                                </div>
                            </div>

                            {/* 小提示卡片 */}
                            <div className="bg-emerald-900/30 border border-emerald-800 p-4 rounded-xl flex items-start gap-3">
                                <AlertCircle className="w-5 h-5 text-emerald-400 shrink-0 mt-0.5" />
                                <p className="text-sm text-emerald-200">
                                系統根據 RAG 歷史數據分析，
                                <span className="font-bold text-white"> {RiskProfiles[riskProfile].label} </span>
                                預期年化報酬約為
                                <span className="font-bold text-white"> {(RiskProfiles[riskProfile].returnRate * 100)}%</span>。
                                </p>
                            </div>
                            </div>

                            {/* 右側：結果儀表板 */}
                            <div className="lg:col-span-2 space-y-6">
                            
                            {/* 核心結果卡片 */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="bg-gradient-to-br from-blue-600 to-blue-800 p-6 rounded-2xl shadow-lg transform transition hover:scale-[1.02]">
                                <div className="flex items-center gap-2 text-blue-100 mb-1">
                                    <DollarSign className="w-4 h-4" />
                                    <span className="text-sm font-medium">建議每月投入金額</span>
                                </div>
                                <div className="text-3xl font-bold text-white tracking-tight">
                                    {formatCurrency(calculationResult.monthlyContribution)}
                                </div>
                                <div className="mt-4 text-xs text-blue-200 bg-blue-900/40 py-1 px-2 rounded inline-block">
                                    持續 {years} 年不間斷
                                </div>
                                </div>

                                <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                                <div className="flex items-center gap-2 text-slate-400 mb-1">
                                    <TrendingUp className="w-4 h-4" />
                                    <span className="text-sm font-medium">達成目標總資產</span>
                                </div>
                                <div className="text-3xl font-bold text-emerald-400 tracking-tight">
                                    {formatCurrency(calculationResult.requiredPrincipal)}
                                </div>
                                <div className="mt-4 flex items-center justify-between text-xs">
                                    <span className="text-slate-500">本金: {formatCurrency(calculationResult.totalPrincipalInvested)}</span>
                                    <span className="text-emerald-500 font-medium">+複利: {formatCurrency(calculationResult.compoundInterestEarned)}</span>
                                </div>
                                </div>
                            </div>

                            {/* 圖表區：資產增長模擬 */}
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                                <h3 className="text-lg font-semibold mb-6">長期資產複利效應分析</h3>
                                <div className="h-64 flex items-end justify-between gap-2 px-2 pb-2 border-b border-slate-600 relative">
                                {/* 簡易長條圖模擬 */}
                                {[...Array(10)].map((_, i) => {
                                    const progress = (i + 1) / 10;
                                    const principalHeight = 20 * progress; // 線性增長
                                    const interestHeight = (80 * (Math.pow(1 + RiskProfiles[riskProfile].returnRate, i * (years/10)) - 1)); 
                                    
                                    return (
                                    <div key={i} className="flex flex-col items-center w-full h-full justify-end group">
                                        <div className="relative w-full max-w-[30px] flex flex-col justify-end h-full">
                                        {/* 複利部分 */}
                                        <div 
                                            style={{ height: `${interestHeight}%` }} 
                                            className="bg-emerald-500/80 w-full rounded-t-sm transition-all duration-1000"
                                        ></div>
                                        {/* 本金部分 */}
                                        <div 
                                            style={{ height: `${principalHeight}%` }} 
                                            className="bg-blue-600/80 w-full rounded-b-sm"
                                        ></div>
                                        
                                        {/* Tooltip */}
                                        <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 bg-slate-900 text-xs py-1 px-2 rounded opacity-0 group-hover:opacity-100 whitespace-nowrap border border-slate-600 z-10 pointer-events-none">
                                            第 {Math.round((i+1) * (years/10))} 年
                                        </div>
                                        </div>
                                    </div>
                                    );
                                })}
                                {/* Y軸標示 */}
                                <div className="absolute left-2 top-2 text-xs text-slate-500">資產總值</div>
                                <div className="absolute right-2 bottom-2 text-xs text-slate-500 flex gap-4">
                                    <span className="flex items-center gap-1"><div className="w-3 h-3 bg-blue-600"></div>本金</span>
                                    <span className="flex items-center gap-1"><div className="w-3 h-3 bg-emerald-500"></div>複利收益</span>
                                </div>
                                </div>
                                <p className="mt-4 text-sm text-slate-400 leading-relaxed">
                                <span className="text-blue-400 font-bold">AI 分析：</span>
                                根據您的{RiskProfiles[riskProfile].label}設定，透過時間複利，約有 
                                <span className="text-white font-bold"> {((calculationResult.compoundInterestEarned / calculationResult.requiredPrincipal) * 100).toFixed(0)}% </span> 
                                的資產來自於投資收益，而非您的本金投入。這就是長期投資的力量。
                                </p>
                            </div>

                            </div>
                        </div>
                        )}

                        {/* --- 分頁 2: 投資組合建議 (Output) --- */}
                        {activeTab === 'portfolio' && (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            
                            {/* 左側：資產配置餅圖 */}
                            <div className="lg:col-span-1 space-y-6">
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                                <h2 className="text-lg font-semibold mb-4">建議資產配置</h2>
                                <div className="flex justify-center mb-6 relative">
                                {/* 使用 CSS Conic Gradient 模擬餅圖 */}
                                <div 
                                    className="w-48 h-48 rounded-full relative"
                                    style={{
                                    background: `conic-gradient(
                                        #3b82f6 0% ${RiskProfiles[riskProfile].allocation.market}%, 
                                        #10b981 ${RiskProfiles[riskProfile].allocation.market}% ${RiskProfiles[riskProfile].allocation.market + RiskProfiles[riskProfile].allocation.dividend}%,
                                        #8b5cf6 ${RiskProfiles[riskProfile].allocation.market + RiskProfiles[riskProfile].allocation.dividend}% ${RiskProfiles[riskProfile].allocation.market + RiskProfiles[riskProfile].allocation.dividend + RiskProfiles[riskProfile].allocation.growth}%,
                                        #f59e0b ${RiskProfiles[riskProfile].allocation.market + RiskProfiles[riskProfile].allocation.dividend + RiskProfiles[riskProfile].allocation.growth}% 100%
                                    )`
                                    }}
                                >
                                    <div className="absolute inset-4 bg-slate-800 rounded-full flex items-center justify-center flex-col">
                                    <span className="text-2xl font-bold text-white">{RiskProfiles[riskProfile].label}</span>
                                    <span className="text-xs text-slate-400">配置策略</span>
                                    </div>
                                </div>
                                </div>

                                <div className="space-y-3">
                                {[
                                    { label: '市場型 ETF', key: 'market', color: 'bg-blue-500' },
                                    { label: '高股息 ETF', key: 'dividend', color: 'bg-emerald-500' },
                                    { label: '成長/產業型', key: 'growth', color: 'bg-violet-500' },
                                    { label: '債券 ETF', key: 'bond', color: 'bg-amber-500' },
                                ].map((item) => (
                                    <div key={item.key} className="flex items-center justify-between p-2 rounded hover:bg-slate-700/50">
                                    <div className="flex items-center gap-2">
                                        <div className={`w-3 h-3 rounded-full ${item.color}`}></div>
                                        <span className="text-sm text-slate-300">{item.label}</span>
                                    </div>
                                    <span className="font-bold">{RiskProfiles[riskProfile].allocation[item.key]}%</span>
                                    </div>
                                ))}
                                </div>
                            </div>
                            
                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                                <h3 className="text-sm font-semibold text-slate-400 mb-3 uppercase tracking-wider">配置理由 (AI 生成)</h3>
                                <div className="text-sm text-slate-300 space-y-3 leading-relaxed">
                                <p>
                                    針對<span className="text-blue-400 font-bold">{RiskProfiles[riskProfile].label}</span>投資人，
                                    我們建議將核心部位放在
                                    {RiskProfiles[riskProfile].allocation.market > RiskProfiles[riskProfile].allocation.bond ? '股票型資產' : '防禦型資產'}。
                                </p>
                                <ul className="list-disc pl-4 space-y-1 text-slate-400">
                                    {RiskProfiles[riskProfile].allocation.dividend > 20 && <li>高比例的高股息 ETF 提供穩定的現金流，降低心理壓力。</li>}
                                    {RiskProfiles[riskProfile].allocation.growth > 20 && <li>配置成長股與半導體 ETF 以追求超越大盤的超額報酬。</li>}
                                    {RiskProfiles[riskProfile].allocation.bond > 30 && <li>高比例債券用於對沖股市崩盤風險，確保退休金保本。</li>}
                                    <li>利用不同資產類別的負相關性，降低整體投資組合波動度。</li>
                                </ul>
                                </div>
                            </div>
                            </div>

                            {/* 右側：ETF 推薦名單 */}
                            <div className="lg:col-span-2 space-y-6">
                            <div className="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden">
                                <div className="p-6 border-b border-slate-700 flex justify-between items-center">
                                <h2 className="text-lg font-semibold flex items-center gap-2">
                                    <Zap className="w-5 h-5 text-yellow-400" />
                                    精選 ETF 投資組合 (Top Picks)
                                </h2>
                                <span className="text-xs bg-blue-900 text-blue-200 px-2 py-1 rounded">RAG 檢索完成</span>
                                </div>
                                
                                <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-900/50 text-slate-400">
                                    <tr>
                                        <th className="p-4 whitespace-nowrap">代號 / 名稱</th>
                                        <th className="p-4 whitespace-nowrap">類型</th>
                                        <th className="p-4 text-right whitespace-nowrap">建議比例</th>
                                        <th className="p-4 text-right whitespace-nowrap">預期殖利率</th>
                                        <th className="p-4 text-right whitespace-nowrap">費用率</th>
                                        <th className="p-4 whitespace-nowrap">風險等級</th>
                                    </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-700">
                                    {recommendedETFs.map((etf, idx) => {
                                        // 簡單計算個別 ETF 在總資產中的權重
                                        const categoryAlloc = RiskProfiles[riskProfile].allocation[etf.category];
                                        const countInCategory = recommendedETFs.filter(e => e.category === etf.category).length;
                                        const individualAlloc = (categoryAlloc / countInCategory).toFixed(1);

                                        return (
                                        <tr key={idx} className="hover:bg-slate-700/30 transition">
                                            <td className="p-4">
                                            <div className="font-bold text-white">{etf.id}</div>
                                            <div className="text-slate-400 text-xs">{etf.name}</div>
                                            </td>
                                            <td className="p-4">
                                            <span className={`px-2 py-1 rounded-full text-xs whitespace-nowrap
                                                ${etf.category === 'market' ? 'bg-blue-900/50 text-blue-300' : 
                                                etf.category === 'dividend' ? 'bg-emerald-900/50 text-emerald-300' :
                                                etf.category === 'bond' ? 'bg-amber-900/50 text-amber-300' : 
                                                'bg-violet-900/50 text-violet-300'}`}>
                                                {etf.type}
                                            </span>
                                            </td>
                                            <td className="p-4 text-right font-medium text-white">{individualAlloc}%</td>
                                            <td className="p-4 text-right text-emerald-400">{etf.yield}%</td>
                                            <td className="p-4 text-right text-slate-400">{etf.expense}%</td>
                                            <td className="p-4">
                                            <div className="flex items-center gap-1">
                                                {[...Array(3)].map((_, i) => (
                                                <div key={i} className={`w-2 h-2 rounded-full ${
                                                    (etf.risk === 'low' && i === 0) ? 'bg-green-500' :
                                                    (etf.risk === 'medium' && i <= 1) ? 'bg-yellow-500' :
                                                    (etf.risk.includes('high') && i <= 2) ? 'bg-red-500' : 'bg-slate-700'
                                                }`}></div>
                                                ))}
                                            </div>
                                            </td>
                                        </tr>
                                        );
                                    })}
                                    </tbody>
                                </table>
                                </div>
                                <div className="p-4 bg-slate-700/20 text-xs text-center text-slate-500 border-t border-slate-700">
                                * 歷史績效不代表未來報酬，投資前請詳閱公開說明書。
                                </div>
                            </div>

                            {/* 每月執行指南 */}
                            <div className="bg-blue-900/20 border border-blue-800 p-6 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-6">
                                <div>
                                <h3 className="text-lg font-bold text-blue-400 mb-2">每月執行指南</h3>
                                <p className="text-slate-300 text-sm">
                                    建議設定 <span className="text-white font-bold">每月 {new Date().getDate()} 號</span> 自動扣款。
                                    將 <span className="text-white font-bold">{formatCurrency(calculationResult.monthlyContribution)}</span> 依照上述比例分配至指定 ETF。
                                </p>
                                </div>
                                <button className="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-medium transition shadow-lg shadow-blue-900/50 flex items-center gap-2" onClick={() => alert("匯出功能為演示用途")}>
                                匯出投資計畫書 <ChevronRight className="w-4 h-4" />
                                </button>
                            </div>
                            </div>
                        </div>
                        )}

                        {/* --- 分頁 3: 再平衡報告 (Rebalance) --- */}
                        {activeTab === 'rebalance' && (
                        <div className="max-w-4xl mx-auto space-y-8">
                            <div className="bg-slate-800 p-8 rounded-2xl border border-slate-700 text-center">
                            <RefreshCw className="w-12 h-12 text-blue-400 mx-auto mb-4 animate-spin-slow" />
                            <h2 className="text-2xl font-bold text-white mb-2">智能定期再平衡</h2>
                            <p className="text-slate-400 max-w-lg mx-auto">
                                系統將每季自動監控您的投資組合。當某類資產偏離目標比例超過 5% 時，AI 將發出換倉訊號。
                            </p>
                            </div>

                            {/* 模擬報告 */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="bg-slate-800 border-l-4 border-red-500 p-6 rounded-r-xl shadow-lg">
                                <div className="flex justify-between items-start mb-4">
                                <h3 className="font-bold text-lg text-white">情境模擬：股市大漲</h3>
                                <span className="text-xs bg-red-900/50 text-red-300 px-2 py-1 rounded">賣出訊號</span>
                                </div>
                                <p className="text-sm text-slate-300 mb-4">
                                假設市場型 ETF (如 0050) 因牛市上漲，佔比從 30% 升至 40%。
                                </p>
                                <div className="bg-slate-900/50 p-4 rounded-lg text-sm space-y-2">
                                <div className="flex justify-between">
                                    <span className="text-red-400">賣出</span>
                                    <span>0050 元大台灣50 (獲利了結)</span>
                                </div>
                                <div className="flex justify-between border-t border-slate-700 pt-2">
                                    <span className="text-green-400">買入</span>
                                    <span>00679B 元大美債20年 (低檔補進)</span>
                                </div>
                                </div>
                                <div className="mt-4 text-xs text-slate-500 flex gap-2 items-center">
                                <Zap className="w-3 h-3" />
                                <span>目的：強迫「買低賣高」，維持風險屬性。</span>
                                </div>
                            </div>

                            <div className="bg-slate-800 border-l-4 border-emerald-500 p-6 rounded-r-xl shadow-lg">
                                <div className="flex justify-between items-start mb-4">
                                <h3 className="font-bold text-lg text-white">情境模擬：殖利率變化</h3>
                                <span className="text-xs bg-emerald-900/50 text-emerald-300 px-2 py-1 rounded">調整訊號</span>
                                </div>
                                <p className="text-sm text-slate-300 mb-4">
                                若某高股息 ETF 因股價上漲導致殖利率下降至 4% 以下。
                                </p>
                                <div className="bg-slate-900/50 p-4 rounded-lg text-sm space-y-2">
                                <div className="flex justify-between">
                                    <span className="text-yellow-400">調降</span>
                                    <span>原高股息 ETF 比例 -10%</span>
                                </div>
                                <div className="flex justify-between border-t border-slate-700 pt-2">
                                    <span className="text-emerald-400">轉進</span>
                                    <span>新興高殖利率 ETF (如 00919)</span>
                                </div>
                                </div>
                                <div className="mt-4 text-xs text-slate-500 flex gap-2 items-center">
                                <Zap className="w-3 h-3" />
                                <span>目的：確保現金流收益率達標。</span>
                                </div>
                            </div>
                            </div>
                        </div>
                        )}

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<InvestmentPlanner />);
    </script>
</body>
</html>
